<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>Planning compléments</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Planning 3 mois</p>
        <h1>À prendre maintenant</h1>
      </div>
      <div class="clock" aria-live="polite">
        <span id="timeNow">--:--</span>
        <small id="dateNow">Aujourd'hui</small>
      </div>
    </header>

    <main>
      <section class="status-panel" aria-label="Statut du jour">
        <div>
          <span class="status-label">Cycle 10 jours</span>
          <strong id="cycleStatus">Calcul...</strong>
        </div>
        <div>
          <span class="status-label">L-glutamine</span>
          <strong id="weekStatus">Calcul...</strong>
        </div>
      </section>

      <section class="quick-controls" aria-label="Réglages">
        <label>
          Début du traitement
          <input id="startDate" type="date" value="2026-06-16">
        </label>
      </section>

      <nav class="time-tabs" aria-label="Moments de la journée">
        <button data-slot="morning" type="button">Matin</button>
        <button data-slot="breakfast" type="button">Petit-déj</button>
        <button data-slot="midday" type="button">Midi</button>
        <button data-slot="afternoon" type="button">Après-midi</button>
        <button data-slot="evening" type="button">Soir</button>
      </nav>

      <section>
        <h2 id="activeTitle">Maintenant</h2>
        <div id="activeList" class="medicine-list"></div>
      </section>

      <section class="all-day">
        <h2>Toute la journée</h2>
        <div id="fullSchedule" class="schedule-list"></div>
      </section>

      <section class="note">
        <strong>À confirmer</strong>
        <p>Pour PERMÉA+, confirme avec médecin/pharmacien si “1 dose” veut dire seulement le sachet, ou sachet + gélules.</p>
      </section>
    </main>

    <dialog id="photoDialog">
      <button class="close-dialog" id="closeDialog" type="button" aria-label="Fermer">×</button>
      <img id="dialogImage" alt="">
      <p id="dialogTitle"></p>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
